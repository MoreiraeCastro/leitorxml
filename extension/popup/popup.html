<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Leitor de XML</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; padding: 16px; color: #1a2129; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: block; font-size: 12px; color: #5c6670; margin: 10px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    button { width: 100%; margin-top: 12px; padding: 8px; border: none; border-radius: 4px; background: #082240; color: #fff; font-size: 13px; cursor: pointer; }
    button.secondary { background: #eef1ef; color: #1a2129; }
    #status { margin-top: 12px; font-size: 12px; color: #5c6670; white-space: pre-wrap; }
    #connectionStatus { margin-top: 4px; padding: 8px 10px; border-radius: 4px; background: #f4f6f5; font-size: 12px; line-height: 1.5; }
    #connectionStatus .row { display: flex; justify-content: space-between; gap: 8px; }
    #connectionStatus .label { color: #5c6670; }
    #connectionStatus .value { font-weight: 600; text-align: right; }
    #connectionStatus .empty { color: #9aa4ac; font-style: italic; }
    #auto { margin-top: 10px; padding: 8px 10px; border-radius: 4px; background: #f4f6f5; font-size: 12px; line-height: 1.5; }
    #auto label { display: flex; align-items: center; gap: 6px; margin: 0; color: #1a2129; font-weight: 600; }
    #auto input { width: auto; }
    #autoStatus { margin-top: 4px; color: #5c6670; }
    #autoStatus.problem { color: #c0392b; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Leitor de XML — Fisco Fácil</h1>

  <div id="connectionStatus"></div>

  <div id="auto">
    <label><input type="checkbox" id="autoEnabled" /> Acompanhamento automático</label>
    <div id="autoStatus"></div>
  </div>

  <label for="apiBaseUrl">URL do backend</label>
  <input id="apiBaseUrl" placeholder="http://localhost:3003/leitorxml" />

  <label for="apiToken">Token (gerado em /leitorxml/estabelecimentos... via API)</label>
  <input id="apiToken" type="password" placeholder="lxml_..." />

  <button id="save">Salvar</button>
  <button id="startSweep" class="secondary">Varrer todas as procurações</button>
  <button id="startNext" class="secondary">Iniciar esteira de solicitações</button>
  <button id="stopBelt" class="secondary">Parar esteira</button>
  <button id="startTracking" class="secondary">Conferir resultados e baixar ZIPs</button>
  <button id="autoNow" class="secondary">Verificar agora (automático)</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
