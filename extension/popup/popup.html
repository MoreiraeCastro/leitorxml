<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Leitor de XML</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; padding: 16px; color: #1a2129; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: block; font-size: 12px; color: #5c6670; margin: 10px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    button { width: 100%; margin-top: 12px; padding: 8px; border: none; border-radius: 4px; background: #082240; color: #fff; font-size: 13px; cursor: pointer; }
    button.secondary { background: #eef1ef; color: #1a2129; }
    #status { margin-top: 12px; font-size: 12px; color: #5c6670; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Leitor de XML — Fisco Fácil</h1>

  <label for="apiBaseUrl">URL do backend</label>
  <input id="apiBaseUrl" placeholder="http://localhost:3003/leitorxml" />

  <label for="apiToken">Token (gerado em /leitorxml/estabelecimentos... via API)</label>
  <input id="apiToken" type="password" placeholder="lxml_..." />

  <button id="save">Salvar</button>
  <button id="startNext" class="secondary">Buscar próxima tarefa</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
